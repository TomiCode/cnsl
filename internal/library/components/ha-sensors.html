{{- with .entities }}
<table class="table w--full">
  <tbody>
  {{- range . }}
    <tr>
      <td><span class="title title--small">{{ .name }}</span></td>
      <td class="text--right"><span class="label">{{ if .numeric }}{{ num $.places .value }}{{ else }}{{ .state }}{{ end }}{{ with .unit }} {{ . }}{{ end }}</span></td>
    </tr>
  {{- end }}
  </tbody>
</table>
{{- else }}
<span class="label">{{ t "no_data" }}</span>
{{- end }}
