{{- with .status }}
<div class="flex flex--col gap--small">
  <span class="title title--small">{{ t "n_of_m_up" .up .total }}</span>
  {{- range .checks }}
  <div class="item">
    <div class="meta"></div>
    <div class="content">
      <span class="title title--small">{{ .name }}</span>
      <span class="description">{{ if .up }}{{ t "up" }}{{ if $.latency }} · {{ .latency_ms }} ms{{ end }}{{ else }}{{ t "down" }} · {{ .error }}{{ end }}</span>
    </div>
  </div>
  {{- end }}
</div>
{{- else }}
<span class="label">{{ t "no_data" }}</span>
{{- end }}
