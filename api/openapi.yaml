openapi: 3.0.3
info:
  title: cnsl dashboard API
  version: 0.12.0
  description: |
    API used by the cnsl web dashboard. Device (firmware) endpoints are not part of this spec;
    they are served on the separate device listener (and mirrored under /device on the
    dashboard listener for the virtual device).
servers:
  - url: /api/v1

tags:
  - name: system
  - name: devices
  - name: screens
  - name: playlists
  - name: assets
  - name: connectors
  - name: firmware
    description: Firmware images and over-the-air updates.
  - name: library
    description: Components and editor snippets.
  - name: stream
    description: Server-Sent Events. Implemented by hand (not generated) because it streams.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency status
      tags: [system]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /system:
    get:
      operationId: getSystem
      summary: Server information the dashboard needs
      tags: [system]
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"

  /settings:
    get:
      operationId: getSettings
      tags: [system]
      responses:
        "200":
          $ref: "#/components/responses/Settings"
    put:
      operationId: updateSettings
      summary: Change global settings; screens using the defaults are re-rendered
      tags: [system]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Settings"
      responses:
        "200":
          $ref: "#/components/responses/Settings"
        "422":
          $ref: "#/components/responses/Problem"

  /icons:
    get:
      operationId: listIcons
      summary: Icons for {{ icon "name" }}; each is also served as /icons/<name>.svg
      tags: [library]
      responses:
        "200":
          description: All icons, sorted by name
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/IconInfo"

  /events:
    get:
      operationId: streamEvents
      summary: Live change notifications
      description: |
        Server-Sent Events stream. Each message's `event` field is the event type and its `data`
        is an Event JSON object. Clients refetch the affected resources when notified.
      tags: [stream]
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"

  /device-models:
    get:
      operationId: listDeviceModels
      tags: [devices]
      responses:
        "200":
          description: All device models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceModel"

  /devices:
    get:
      operationId: listDevices
      summary: All devices, pending first
      tags: [devices]
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"

  /devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      operationId: getDevice
      tags: [devices]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateDevice
      summary: Change device settings
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDevice
      summary: Remove a device (it reappears as pending when it next contacts the server)
      tags: [devices]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"

  /devices/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      operationId: approveDevice
      summary: Activate a pending or disabled device
      tags: [devices]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /devices/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      operationId: disableDevice
      tags: [devices]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"

  /devices/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      operationId: listDeviceLogs
      summary: Device logs, newest first
      tags: [devices]
      parameters:
        - name: before_id
          in: query
          description: Page backwards from this log id (exclusive).
          schema: { type: integer, format: int64 }
        - name: after_id
          in: query
          description: Only logs newer than this id (live tail).
          schema: { type: integer, format: int64 }
        - name: level
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
        - name: q
          in: query
          description: Substring search in the message.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLogPage"
        "404":
          $ref: "#/components/responses/Problem"

  /devices/{id}/telemetry:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      operationId: listDeviceTelemetry
      summary: Telemetry history, newest first
      tags: [devices]
      parameters:
        - name: before_id
          in: query
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Telemetry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Telemetry"
        "404":
          $ref: "#/components/responses/Problem"

  /devices/{id}/playlist:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    put:
      operationId: setDevicePlaylist
      summary: Assign a playlist (or none) and restart the rotation
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playlist_id: { type: integer, format: int64, nullable: true }
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /devices/{id}/calibration:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      operationId: startDeviceCalibration
      summary: Show the gray calibration pattern on the device for 30 minutes
      tags: [devices]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: stopDeviceCalibration
      tags: [devices]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"

  /device-models/{id}/firmware:
    parameters:
      - $ref: "#/components/parameters/ModelID"
    put:
      operationId: setModelFirmware
      summary: Choose the firmware devices of this model are updated to (null = none)
      tags: [firmware]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firmware_id]
              properties:
                firmware_id: { type: integer, format: int64, nullable: true }
      responses:
        "200":
          description: The model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceModel"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /firmware:
    get:
      operationId: listFirmware
      tags: [firmware]
      responses:
        "200":
          description: Uploaded firmware images, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Firmware"
    post:
      operationId: uploadFirmware
      summary: Upload an app image (.bin); it is checked before it can be offered
      tags: [firmware]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                version:
                  type: string
                  description: |
                    The version devices report (FW-Version) after installing it. Guessed from the
                    file name or the image when omitted.
                notes:
                  type: string
      responses:
        "201":
          $ref: "#/components/responses/Firmware"
        "422":
          $ref: "#/components/responses/Problem"

  /firmware/{id}:
    parameters:
      - $ref: "#/components/parameters/FirmwareID"
    patch:
      operationId: updateFirmware
      tags: [firmware]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [version]
              properties:
                version: { type: string, minLength: 1, maxLength: 40 }
                notes: { type: string, maxLength: 1000 }
      responses:
        "200":
          $ref: "#/components/responses/Firmware"
        "404":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteFirmware
      summary: Delete a firmware image; models using it as target get none
      tags: [firmware]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"

  /devices/{id}/ota/retry:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      operationId: retryDeviceOTA
      summary: Clear the update attempts so the target firmware is offered again at the next wake
      tags: [firmware]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"

  /device-models/{id}/tone-curve:
    parameters:
      - $ref: "#/components/parameters/ModelID"
    put:
      operationId: setToneCurve
      summary: Save a model's gray tone curve; its screens re-render
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToneCurve"
      responses:
        "200":
          description: The model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceModel"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /device-models/{id}/tone-curve/preview:
    parameters:
      - $ref: "#/components/parameters/ModelID"
    post:
      operationId: previewToneCurve
      summary: Render the calibration pattern with an unsaved curve
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToneCurve"
      responses:
        "200":
          description: Calibration pattern as the device would get it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /screens:
    get:
      operationId: listScreens
      tags: [screens]
      responses:
        "200":
          description: All screens (without templates)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScreenSummary"
    post:
      operationId: createScreen
      summary: Create a screen with one full-size region and a starter template
      tags: [screens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenCreate"
      responses:
        "201":
          $ref: "#/components/responses/Screen"
        "422":
          $ref: "#/components/responses/Problem"

  /screens/{id}:
    parameters:
      - $ref: "#/components/parameters/ScreenID"
    get:
      operationId: getScreen
      tags: [screens]
      responses:
        "200":
          $ref: "#/components/responses/Screen"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateScreen
      summary: Save a screen; it re-renders shortly after
      tags: [screens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Screen"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: Invalid input or template syntax errors
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TemplateProblem"
    delete:
      operationId: deleteScreen
      tags: [screens]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"

  /screens/{id}/preview:
    parameters:
      - $ref: "#/components/parameters/ScreenID"
    post:
      operationId: previewScreen
      summary: Render a screen, optionally with unsaved templates, without storing it
      tags: [screens]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
      responses:
        "200":
          description: The browser render and the device image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /screens/{id}/renders:
    parameters:
      - $ref: "#/components/parameters/ScreenID"
    get:
      operationId: listScreenRenders
      summary: Render history, newest first
      tags: [screens]
      responses:
        "200":
          description: Renders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Render"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: renderScreen
      summary: Render and store now
      tags: [screens]
      responses:
        "200":
          description: The new render
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
        "404":
          $ref: "#/components/responses/Problem"

  /playlists:
    get:
      operationId: listPlaylists
      tags: [playlists]
      responses:
        "200":
          description: All playlists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Playlist"
    post:
      operationId: createPlaylist
      tags: [playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistInput"
      responses:
        "201":
          $ref: "#/components/responses/Playlist"
        "422":
          $ref: "#/components/responses/Problem"

  /playlists/{id}:
    parameters:
      - $ref: "#/components/parameters/PlaylistID"
    get:
      operationId: getPlaylist
      tags: [playlists]
      responses:
        "200":
          $ref: "#/components/responses/Playlist"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updatePlaylist
      summary: Replace name and items (items keep their id when given)
      tags: [playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistInput"
      responses:
        "200":
          $ref: "#/components/responses/Playlist"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"

  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      responses:
        "200":
          description: Uploaded images, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"
    post:
      operationId: uploadAsset
      summary: Upload an image (PNG, JPEG or GIF); identical files are stored once
      tags: [assets]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                name:
                  type: string
                  description: Defaults to the file name.
      responses:
        "201":
          description: The asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "422":
          $ref: "#/components/responses/Problem"

  /assets/{id}:
    parameters:
      - $ref: "#/components/parameters/AssetID"
    delete:
      operationId: deleteAsset
      tags: [assets]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: Still used by a screen background
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /assets/{id}/preview:
    parameters:
      - $ref: "#/components/parameters/AssetID"
    post:
      operationId: previewAsset
      summary: Show an image as a device model would display it
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model_id]
              properties:
                model_id: { type: integer, format: int64 }
                fit:
                  $ref: "#/components/schemas/ImageFit"
                dither:
                  $ref: "#/components/schemas/ImageDither"
      responses:
        "200":
          description: The processed image
          content:
            application/json:
              schema:
                type: object
                required: [device]
                properties:
                  device:
                    type: string
                    description: data:image/png;base64 URL
        "404":
          $ref: "#/components/responses/Problem"

  /components:
    get:
      operationId: listComponents
      tags: [library]
      responses:
        "200":
          description: Built-in and user components
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Component"
    post:
      operationId: createComponent
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentInput"
      responses:
        "201":
          $ref: "#/components/responses/Component"
        "422":
          $ref: "#/components/responses/TemplateProblem"

  /components/preview:
    post:
      operationId: previewComponent
      summary: Render a (possibly unsaved) component on its own with sample data
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentPreviewRequest"
      responses:
        "200":
          description: Rendered preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/TemplateProblem"
        "503":
          $ref: "#/components/responses/Problem"

  /components/{id}:
    parameters:
      - $ref: "#/components/parameters/ComponentID"
    get:
      operationId: getComponent
      tags: [library]
      responses:
        "200":
          $ref: "#/components/responses/Component"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateComponent
      summary: Update a user component and re-render the screens that use it
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComponentInput"
      responses:
        "200":
          $ref: "#/components/responses/Component"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: Built-in components are read-only; a used component cannot change its key
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/TemplateProblem"
    delete:
      operationId: deleteComponent
      tags: [library]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: Built-in, or still used by a screen
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /components/{id}/duplicate:
    parameters:
      - $ref: "#/components/parameters/ComponentID"
    post:
      operationId: duplicateComponent
      summary: Copy a component (e.g. a built-in) into an editable user component
      tags: [library]
      responses:
        "201":
          $ref: "#/components/responses/Component"
        "404":
          $ref: "#/components/responses/Problem"

  /snippets:
    get:
      operationId: listSnippets
      tags: [library]
      responses:
        "200":
          description: Built-in and user editor snippets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Snippet"
    post:
      operationId: createSnippet
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnippetInput"
      responses:
        "201":
          $ref: "#/components/responses/Snippet"
        "422":
          $ref: "#/components/responses/Problem"

  /snippets/{id}:
    parameters:
      - $ref: "#/components/parameters/SnippetID"
    put:
      operationId: updateSnippet
      tags: [library]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SnippetInput"
      responses:
        "200":
          $ref: "#/components/responses/Snippet"
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: Built-in snippets are read-only
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteSnippet
      tags: [library]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"
        "409":
          description: Built-in snippets are read-only
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"

  /connector-types:
    get:
      operationId: listConnectorTypes
      tags: [connectors]
      responses:
        "200":
          description: Available connector types with their settings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConnectorType"

  /connectors:
    get:
      operationId: listConnectors
      tags: [connectors]
      responses:
        "200":
          description: Configured connectors (secrets are never returned)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Connector"
    post:
      operationId: createConnector
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorInput"
      responses:
        "201":
          $ref: "#/components/responses/Connector"
        "422":
          $ref: "#/components/responses/Problem"

  /connectors/{id}:
    parameters:
      - $ref: "#/components/parameters/ConnectorID"
    put:
      operationId: updateConnector
      summary: Update name and settings; secret fields left empty keep their stored value
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectorInput"
      responses:
        "200":
          $ref: "#/components/responses/Connector"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteConnector
      summary: Delete a connector and every binding that uses it
      tags: [connectors]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"

  /connectors/{id}/test:
    parameters:
      - $ref: "#/components/parameters/ConnectorID"
    post:
      operationId: testConnector
      summary: Fetch once with the given params (not cached)
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                params:
                  type: object
                  additionalProperties: true
      responses:
        "200":
          description: Result of the fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConnectorTestResult"
        "404":
          $ref: "#/components/responses/Problem"

  /screens/{id}/bindings:
    parameters:
      - $ref: "#/components/parameters/ScreenID"
    get:
      operationId: listBindings
      tags: [connectors]
      responses:
        "200":
          description: The screen's bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Binding"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: replaceBindings
      summary: Replace the screen's bindings (matched by id; omit id for new ones)
      tags: [connectors]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              maxItems: 30
              items:
                $ref: "#/components/schemas/Binding"
      responses:
        "200":
          description: The saved bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Binding"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /screens/{id}/data:
    parameters:
      - $ref: "#/components/parameters/ScreenID"
    get:
      operationId: getScreenData
      summary: Current data of every binding, as templates see it (fetches what is missing)
      tags: [connectors]
      parameters:
        - name: sample
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Data by binding alias
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  $ref: "#/components/schemas/BindingData"
        "404":
          $ref: "#/components/responses/Problem"

components:
  parameters:
    DeviceID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ScreenID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PlaylistID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ModelID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ConnectorID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    FirmwareID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ComponentID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    SnippetID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    AssetID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }

  responses:
    Device:
      description: The device
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Device"
    Screen:
      description: The screen
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Screen"
    Playlist:
      description: The playlist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Playlist"
    Connector:
      description: The connector
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Connector"
    Firmware:
      description: The firmware
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Firmware"
    Component:
      description: The component
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Component"
    Settings:
      description: Global settings
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Settings"
    Snippet:
      description: The snippet
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Snippet"
    TemplateProblem:
      description: Invalid input or template syntax errors
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/TemplateProblem"
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          example: 0.1.0
        database:
          type: string
          enum: [ok, error]

    SystemInfo:
      type: object
      required: [version, timezone, device_public_url, template_functions, framework_version, layouts, languages]
      properties:
        version: { type: string }
        languages:
          type: array
          description: Languages screens can be rendered in.
          items:
            type: object
            required: [code, name]
            properties:
              code: { type: string, example: pl }
              name: { type: string, example: Polski }
        framework_version: { type: string, example: 3.4.4 }
        template_functions:
          type: array
          items: { type: string }
          description: Helper functions available in screen templates.
        layouts:
          type: array
          items:
            $ref: "#/components/schemas/Layout"
        timezone: { type: string, example: Europe/Vienna }
        device_public_url:
          type: string
          description: Base URL devices use to reach the device listener; empty if not configured.

    Event:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [device.created, device.updated, device.deleted, device.seen, device.logs,
                 screen.updated, screen.rendered, playlist.updated, model.updated]
        device_id: { type: integer, format: int64 }
        screen_id: { type: integer, format: int64 }
        playlist_id: { type: integer, format: int64 }
        model_id: { type: integer, format: int64 }

    DeviceModel:
      type: object
      required: [id, key, name, width, height, bit_depth, tone_curve]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string }
        name: { type: string }
        firmware_model: { type: string, nullable: true }
        width: { type: integer }
        height: { type: integer }
        bit_depth: { type: integer, enum: [1, 2, 4] }
        tone_curve:
          $ref: "#/components/schemas/ToneCurve"
        chip:
          type: string
          description: Chip the model's firmware is built for (esp32s3, …); empty = no updates.
        firmware_id:
          type: integer
          format: int64
          nullable: true
          description: Firmware devices of this model are updated to (when they opt in).

    DeviceStatus:
      type: string
      enum: [pending, active, disabled]

    Device:
      type: object
      required: [id, mac, api_key, friendly_id, label, status, refresh_rate, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        mac: { type: string, example: "AA:BB:CC:DD:EE:FF" }
        api_key: { type: string }
        friendly_id: { type: string, example: K7Q2XM }
        label: { type: string }
        status:
          $ref: "#/components/schemas/DeviceStatus"
        model_id: { type: integer, format: int64, nullable: true }
        refresh_rate:
          type: integer
          description: Seconds between wakes.
        sleep_start: { type: string, nullable: true, example: "22:00" }
        sleep_end: { type: string, nullable: true, example: "06:00" }
        playlist_id: { type: integer, format: int64, nullable: true }
        calibrating_until:
          type: string
          format: date-time
          nullable: true
          description: While in the future, the device shows the gray calibration pattern.
        firmware_version: { type: string, nullable: true }
        reported_model: { type: string, nullable: true }
        reported_width: { type: integer, nullable: true }
        reported_height: { type: integer, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        latest:
          $ref: "#/components/schemas/Telemetry"
        auto_update:
          type: boolean
          description: Install the model's target firmware over the air.
        ota:
          $ref: "#/components/schemas/OTAStatus"

    OTAStatus:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [off, no_target, current, due, pending, gave_up]
          description: |
            off = auto-update disabled; no_target = the model has no target firmware;
            current = runs the target; due = offered at the next wake; pending = offered, waiting
            for the device to report the new version; gave_up = offered 3 times without success.
        target_version: { type: string }
        target_id: { type: integer, format: int64 }
        attempts: { type: integer }
        offered_at: { type: string, format: date-time }

    Firmware:
      type: object
      required: [id, version, chip, project, built, idf, size, sha256, filename, notes, created_at, model_ids]
      properties:
        id: { type: integer, format: int64 }
        version:
          type: string
          description: What devices report after installing it.
        chip: { type: string, example: esp32s3 }
        project: { type: string }
        built: { type: string }
        idf: { type: string }
        size: { type: integer, format: int64 }
        sha256: { type: string }
        filename: { type: string }
        notes: { type: string }
        created_at: { type: string, format: date-time }
        model_ids:
          type: array
          description: Models that use it as their target.
          items: { type: integer, format: int64 }

    DeviceUpdate:
      type: object
      properties:
        auto_update: { type: boolean }
        label: { type: string, maxLength: 100 }
        model_id: { type: integer, format: int64 }
        refresh_rate: { type: integer, minimum: 30, maximum: 86400 }
        sleep_start:
          type: string
          description: HH:MM, empty string clears the sleep window.
        sleep_end:
          type: string
          description: HH:MM, empty string clears the sleep window.

    ImageFit:
      type: string
      enum: [contain, cover]
      default: cover

    ImageDither:
      type: string
      enum: [none, floyd-steinberg, atkinson, ordered]
      default: floyd-steinberg

    Telemetry:
      type: object
      required: [id, at]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        battery_voltage: { type: number, nullable: true }
        battery_percent: { type: number, nullable: true }
        charging: { type: boolean, nullable: true }
        usb_connected: { type: boolean, nullable: true }
        rssi: { type: integer, nullable: true }
        wake_reason: { type: string, nullable: true }
        wake_time: { type: integer, nullable: true }
        firmware_version: { type: string, nullable: true }
        image_cached: { type: boolean, nullable: true }
        served_filename: { type: string, nullable: true }
        raw_headers:
          type: object
          nullable: true
          additionalProperties: { type: string }

    DeviceLog:
      type: object
      required: [id, message, received_at]
      properties:
        id: { type: integer, format: int64 }
        device_log_id: { type: integer, format: int64, nullable: true }
        level: { type: string, nullable: true }
        message: { type: string }
        source_path: { type: string, nullable: true }
        source_line: { type: integer, nullable: true }
        device_time: { type: string, format: date-time, nullable: true }
        received_at: { type: string, format: date-time }
        extra:
          type: object
          nullable: true
          additionalProperties: true

    DeviceLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeviceLog"
        next_before_id:
          type: integer
          format: int64
          nullable: true
          description: Pass as before_id to load older entries; null when there are none.

    ToneCurve:
      type: object
      required: [gamma, black, white]
      properties:
        gamma: { type: number, minimum: 0.2, maximum: 5, example: 1.0 }
        black: { type: number, minimum: 0, maximum: 0.8, example: 0.0 }
        white: { type: number, minimum: 0.2, maximum: 1, example: 1.0 }
        levels:
          type: array
          nullable: true
          maxItems: 16
          items: { type: number, minimum: 0, maximum: 1 }
          description: |
            Measured brightness of each device gray level on the panel (0 = black, 1 = white),
            one per level. Quantization and dithering target these real levels; null = evenly
            spaced.

    Arrange:
      type: object
      description: |
        How a region lays out its content. The region supplies the framework layout (and title bar);
        the template only lists the pieces. mode "" = the template brings its own layout.
      required: [mode]
      properties:
        mode:
          type: string
          enum: ["", stack, row, grid, columns]
        cols:
          type: integer
          minimum: 0
          maximum: 6
          description: Grid columns; 0 = as many as fit.
        align:
          type: string
          enum: ["", top, center, bottom]
        gap:
          type: string
          enum: ["", none, small, medium, large, xlarge]
        title_bar:
          type: string
          description: Template for the title bar below the layout; empty = none.

    Block:
      type: object
      description: |
        A piece of a region edited without HTML: a component call (component + args), or an
        HTML/template snippet (html). The region's arrangement places the blocks.
      properties:
        component: { type: string }
        args:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/BlockArg"
        html: { type: string, maxLength: 100000 }

    BlockArg:
      type: object
      description: An input value, either a data path (.Data.alias.field) or a literal.
      properties:
        path: { type: string }
        value: {}

    Region:
      type: object
      required: [id, key, x, y, w, h, z, transparent, template, arrange]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, example: main }
        x: { type: integer }
        y: { type: integer }
        w: { type: integer }
        h: { type: integer }
        z: { type: integer }
        transparent:
          type: boolean
          description: Let the screen background show through this region.
        template: { type: string }
        arrange:
          $ref: "#/components/schemas/Arrange"
        blocks:
          type: array
          nullable: true
          description: The region's blocks; null when it is edited as HTML.
          items:
            $ref: "#/components/schemas/Block"

    Render:
      type: object
      required: [id, status, duration_ms, trigger, created_at]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [ok, error] }
        filename: { type: string, nullable: true }
        error: { type: string, nullable: true }
        duration_ms: { type: integer, format: int64 }
        trigger: { type: string, example: edit }
        created_at: { type: string, format: date-time }

    ScreenKind:
      type: string
      enum: [template, image]
      description: template = HTML regions rendered by the browser; image = just the background.

    Background:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [none, image, slideshow]
        asset_ids:
          type: array
          items: { type: integer, format: int64 }
        fit:
          $ref: "#/components/schemas/ImageFit"
        dither:
          $ref: "#/components/schemas/ImageDither"
        order:
          type: string
          enum: [sequential, shuffle]
          default: sequential

    Layout:
      type: object
      required: [key, name, slots]
      properties:
        key: { type: string, example: 1Lx2R }
        name: { type: string }
        slots:
          type: array
          description: Empty for the free layout.
          items:
            type: object
            required: [key, view, x, y, w, h]
            properties:
              key: { type: string }
              view: { type: string }
              x: { type: number }
              y: { type: number }
              w: { type: number }
              h: { type: number }

    ScreenSummary:
      type: object
      required: [id, name, kind, layout, model_id, render_interval, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind:
          $ref: "#/components/schemas/ScreenKind"
        layout: { type: string }
        model_id: { type: integer, format: int64 }
        render_interval: { type: integer }
        updated_at: { type: string, format: date-time }
        latest_render:
          $ref: "#/components/schemas/Render"
        latest_image:
          type: string
          nullable: true
          description: Filename of the newest successful render.

    Screen:
      allOf:
        - $ref: "#/components/schemas/ScreenSummary"
        - type: object
          required: [framework_version, head, regions, background, language, rotation]
          properties:
            framework_version: { type: string }
            rotation:
              $ref: "#/components/schemas/Rotation"
            language:
              type: string
              description: Language override; empty uses the global setting.
            background:
              $ref: "#/components/schemas/Background"
            head:
              type: string
              description: Extra HTML for the page head (styles).
            regions:
              type: array
              items:
                $ref: "#/components/schemas/Region"

    ScreenCreate:
      type: object
      required: [name, model_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        model_id: { type: integer, format: int64 }
        kind:
          $ref: "#/components/schemas/ScreenKind"

    ScreenUpdate:
      type: object
      required: [name, model_id, head, render_interval, layout, background, regions]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        model_id: { type: integer, format: int64 }
        head: { type: string, maxLength: 100000 }
        render_interval: { type: integer, minimum: 60, maximum: 86400 }
        language:
          type: string
          maxLength: 10
          description: Language code from /system languages; empty uses the global setting.
        rotation:
          $ref: "#/components/schemas/Rotation"
        layout:
          type: string
          description: A layout key from /system layouts. Changing it adds or removes regions.
        background:
          $ref: "#/components/schemas/Background"
        regions:
          type: array
          maxItems: 50
          description: |
            Region contents. For preset layouts regions are matched by id (or key) and their
            rectangles come from the layout; for the free layout the list defines the regions
            (omit id for new ones).
          items:
            type: object
            required: [key, template]
            properties:
              id: { type: integer, format: int64 }
              key: { type: string, minLength: 1, maxLength: 40, pattern: "^[a-z0-9_]+$" }
              template: { type: string, maxLength: 200000 }
              transparent: { type: boolean }
              arrange:
                $ref: "#/components/schemas/Arrange"
              blocks:
                type: array
                nullable: true
                maxItems: 100
                description: |
                  Blocks for the region; the template is generated from them. Omitted or null:
                  the region is edited as HTML and template is used as given.
                items:
                  $ref: "#/components/schemas/Block"
              x: { type: integer }
              y: { type: integer }
              w: { type: integer }
              h: { type: integer }
              z: { type: integer }

    PreviewRequest:
      type: object
      properties:
        sample:
          type: boolean
          description: Use connector sample data instead of real data.
        templates:
          type: object
          description: Unsaved region templates by region key.
          additionalProperties: { type: string }
        arrange:
          type: object
          description: Unsaved region arrangements by region key.
          additionalProperties:
            $ref: "#/components/schemas/Arrange"
        blocks:
          type: object
          description: Unsaved region blocks by region key (replace those regions' templates).
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Block"
        head: { type: string }

    TemplateError:
      type: object
      required: [region, line, column, message]
      properties:
        region: { type: string }
        line: { type: integer }
        column: { type: integer }
        message: { type: string }

    Preview:
      type: object
      required: [raw, device, errors, duration_ms]
      properties:
        raw:
          type: string
          description: data:image/png;base64 URL of the browser screenshot.
        device:
          type: string
          description: data:image/png;base64 URL of the image as the device gets it.
        panel:
          type: string
          description: data:image/png;base64 URL of how the panel shows it (measured gray levels).
        errors:
          type: array
          items:
            $ref: "#/components/schemas/TemplateError"
        data_errors:
          type: object
          description: Connector problems by binding alias.
          additionalProperties: { type: string }
        duration_ms: { type: integer, format: int64 }
        boxes:
          type: array
          description: |
            Where regions, blocks and template lines ended up, in device pixels of the screen as
            designed (screen previews only). The editor maps clicks on the preview with them.
          items:
            $ref: "#/components/schemas/LocateBox"

    LocateBox:
      type: object
      required: [region, x, y, w, h]
      properties:
        region: { type: string }
        block: { type: integer }
        line: { type: integer }
        x: { type: number }
        y: { type: number }
        w: { type: number }
        h: { type: number }

    TemplateProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            template_errors:
              type: array
              items:
                $ref: "#/components/schemas/TemplateError"

    PlaylistItem:
      type: object
      required: [screen_id, dwell, enabled]
      properties:
        id:
          type: integer
          format: int64
          description: Omit for new items.
        screen_id: { type: integer, format: int64 }
        dwell:
          type: integer
          minimum: 1
          maximum: 1000
          description: Number of device wakes the item stays on screen.
        refresh_rate:
          type: integer
          nullable: true
          minimum: 30
          maximum: 86400
          description: Seconds between wakes while this item shows; null = the device's own rate.
        enabled: { type: boolean }

    Playlist:
      type: object
      required: [id, name, items, device_count, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistItem"
        device_count: { type: integer }
        updated_at: { type: string, format: date-time }

    PlaylistInput:
      type: object
      required: [name, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PlaylistItem"

    Asset:
      type: object
      required: [id, name, url, width, height, size, created_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        url:
          type: string
          description: The original upload (for thumbnails).
        width: { type: integer }
        height: { type: integer }
        size: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }

    Rotation:
      type: integer
      enum: [0, 90, 180, 270]
      description: |
        Clockwise degrees from the screen as designed to the panel. 0 = landscape, 90 = portrait
        with the device turned left (counter-clockwise), 180 = upside down, 270 = portrait with
        the device turned right. Portrait screens are designed at swapped width and height.

    Settings:
      type: object
      required: [language]
      properties:
        language:
          type: string
          description: Default language of screens (a code from /system languages).

    IconInfo:
      type: object
      required: [name, set]
      properties:
        name: { type: string, example: wi-day-sunny }
        set:
          type: string
          enum: [wi, lucide]
          description: wi = Weather Icons (filled), lucide = outline icons.
        tags:
          type: array
          items: { type: string }

    ComponentParam:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_]*$"
          description: Field name inside the component (.name).
        label: { type: string }
        kind:
          type: string
          enum: [data, string, number, bool]
        connector:
          type: string
          description: Connector type a data input expects (insert flow, preview samples).
        default: {}
        help: { type: string }
        sample:
          description: Example value for previews; data inputs fall back to the connector's sample.

    Component:
      type: object
      required: [id, key, name, description, source, inputs, builtin, used_by, updated_at]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string }
        name: { type: string }
        description: { type: string }
        source: { type: string }
        inputs:
          type: array
          items:
            $ref: "#/components/schemas/ComponentParam"
        builtin: { type: boolean }
        used_by:
          type: array
          description: Ids of screens whose templates call this component.
          items: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }

    ComponentInput:
      type: object
      required: [key, name, source, inputs]
      properties:
        key:
          type: string
          pattern: "^[a-z][a-z0-9-]*$"
          maxLength: 60
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        source: { type: string, maxLength: 200000 }
        inputs:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/ComponentParam"

    ComponentPreviewRequest:
      type: object
      required: [model_id, component]
      properties:
        model_id: { type: integer, format: int64 }
        component:
          $ref: "#/components/schemas/ComponentInput"
        view:
          type: string
          enum: [full, half_vertical, half_horizontal, quadrant]
          default: full
        values:
          type: object
          description: Input values by name; other inputs use their sample or default.
          additionalProperties: true
        language:
          type: string
          maxLength: 10
          description: Render in this language instead of the global setting.

    Snippet:
      type: object
      required: [id, prefix, name, description, body, builtin, updated_at]
      properties:
        id: { type: integer, format: int64 }
        prefix: { type: string }
        name: { type: string }
        description: { type: string }
        body:
          type: string
          description: Monaco snippet syntax ($1, ${1:default}, $0).
        builtin: { type: boolean }
        updated_at: { type: string, format: date-time }

    SnippetInput:
      type: object
      required: [prefix, name, body]
      properties:
        prefix:
          type: string
          pattern: "^[A-Za-z_][A-Za-z0-9_-]*$"
          maxLength: 40
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        body: { type: string, minLength: 1, maxLength: 20000 }

    ConnectorField:
      type: object
      required: [key, label, kind]
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        kind:
          type: string
          enum: [string, secret, url, int, number, bool, select, list, text]
        required: { type: boolean }
        default: {}
        options:
          type: array
          items: { type: string }

    ConnectorType:
      type: object
      required: [key, name, description, config_schema, params_schema]
      properties:
        key: { type: string, example: homeassistant }
        name: { type: string }
        description: { type: string }
        config_schema:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorField"
        params_schema:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorField"

    Connector:
      type: object
      required: [id, type, name, config, secrets_set, binding_count, updated_at]
      properties:
        id: { type: integer, format: int64 }
        type: { type: string }
        name: { type: string }
        config:
          type: object
          additionalProperties: true
          description: Settings without secret fields.
        secrets_set:
          type: array
          items: { type: string }
          description: Secret fields that have a stored value.
        binding_count: { type: integer }
        updated_at: { type: string, format: date-time }

    ConnectorInput:
      type: object
      required: [name, config]
      properties:
        type:
          type: string
          description: Required when creating; ignored on update.
        name: { type: string, minLength: 1, maxLength: 100 }
        config:
          type: object
          additionalProperties: true

    ConnectorTestResult:
      type: object
      required: [ok, duration_ms]
      properties:
        ok: { type: boolean }
        data: {}
        error: { type: string }
        duration_ms: { type: integer, format: int64 }

    Binding:
      type: object
      required: [connector_id, alias, params, ttl, enabled]
      properties:
        id: { type: integer, format: int64 }
        connector_id: { type: integer, format: int64 }
        alias:
          type: string
          pattern: "^[a-z][a-z0-9_]*$"
          maxLength: 40
          description: Templates read the data as .Data.<alias>.
        region_key:
          type: string
          nullable: true
          description: Only this region sees the data; null = every region.
        params:
          type: object
          additionalProperties: true
        ttl:
          type: integer
          minimum: 30
          maximum: 86400
          description: Seconds before the data is fetched again.
        enabled: { type: boolean }

    BindingData:
      type: object
      required: [stale]
      properties:
        data: {}
        stale: { type: boolean }
        fetched_at: { type: string, format: date-time, nullable: true }
        error: { type: string }

    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [message]
      properties:
        field:
          type: string
        message:
          type: string
