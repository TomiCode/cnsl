openapi: 3.0.3
info:
  title: cnsl dashboard API
  version: 0.3.0
  description: |
    API used by the cnsl web dashboard. Device (firmware) endpoints are not part of this spec;
    they are served on the separate device listener (and mirrored under /device on the
    dashboard listener for the virtual device).
servers:
  - url: /api/v1

tags:
  - name: system
  - name: devices
  - name: screens
  - name: playlists
  - name: stream
    description: Server-Sent Events. Implemented by hand (not generated) because it streams.

paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness and dependency status
      tags: [system]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: Service is degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /system:
    get:
      operationId: getSystem
      summary: Server information the dashboard needs
      tags: [system]
      responses:
        "200":
          description: System information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemInfo"

  /events:
    get:
      operationId: streamEvents
      summary: Live change notifications
      description: |
        Server-Sent Events stream. Each message's `event` field is the event type and its `data`
        is an Event JSON object. Clients refetch the affected resources when notified.
      tags: [stream]
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/Event"

  /device-models:
    get:
      operationId: listDeviceModels
      tags: [devices]
      responses:
        "200":
          description: All device models
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceModel"

  /devices:
    get:
      operationId: listDevices
      summary: All devices, pending first
      tags: [devices]
      responses:
        "200":
          description: Devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"

  /devices/{id}:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      operationId: getDevice
      tags: [devices]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"
    patch:
      operationId: updateDevice
      summary: Change device settings
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteDevice
      summary: Remove a device (it reappears as pending when it next contacts the server)
      tags: [devices]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"

  /devices/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      operationId: approveDevice
      summary: Activate a pending or disabled device
      tags: [devices]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /devices/{id}/disable:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      operationId: disableDevice
      tags: [devices]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"

  /devices/{id}/image:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    put:
      operationId: setDeviceImage
      summary: Upload a static image for the device (until screens exist)
      tags: [devices]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG or GIF
                fit:
                  $ref: "#/components/schemas/ImageFit"
                dither:
                  $ref: "#/components/schemas/ImageDither"
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: clearDeviceImage
      tags: [devices]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"

  /devices/{id}/logs:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      operationId: listDeviceLogs
      summary: Device logs, newest first
      tags: [devices]
      parameters:
        - name: before_id
          in: query
          description: Page backwards from this log id (exclusive).
          schema: { type: integer, format: int64 }
        - name: after_id
          in: query
          description: Only logs newer than this id (live tail).
          schema: { type: integer, format: int64 }
        - name: level
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { type: string }
        - name: q
          in: query
          description: Substring search in the message.
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLogPage"
        "404":
          $ref: "#/components/responses/Problem"

  /devices/{id}/telemetry:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      operationId: listDeviceTelemetry
      summary: Telemetry history, newest first
      tags: [devices]
      parameters:
        - name: before_id
          in: query
          schema: { type: integer, format: int64 }
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Telemetry
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Telemetry"
        "404":
          $ref: "#/components/responses/Problem"

  /devices/{id}/playlist:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    put:
      operationId: setDevicePlaylist
      summary: Assign a playlist (or none) and restart the rotation
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                playlist_id: { type: integer, format: int64, nullable: true }
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /devices/{id}/calibration:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    post:
      operationId: startDeviceCalibration
      summary: Show the gray calibration pattern on the device for 30 minutes
      tags: [devices]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: stopDeviceCalibration
      tags: [devices]
      responses:
        "200":
          $ref: "#/components/responses/Device"
        "404":
          $ref: "#/components/responses/Problem"

  /device-models/{id}/tone-curve:
    parameters:
      - $ref: "#/components/parameters/ModelID"
    put:
      operationId: setToneCurve
      summary: Save a model's gray tone curve; its screens re-render
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToneCurve"
      responses:
        "200":
          description: The model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceModel"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"

  /device-models/{id}/tone-curve/preview:
    parameters:
      - $ref: "#/components/parameters/ModelID"
    post:
      operationId: previewToneCurve
      summary: Render the calibration pattern with an unsaved curve
      tags: [devices]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ToneCurve"
      responses:
        "200":
          description: Calibration pattern as the device would get it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /screens:
    get:
      operationId: listScreens
      tags: [screens]
      responses:
        "200":
          description: All screens (without templates)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ScreenSummary"
    post:
      operationId: createScreen
      summary: Create a screen with one full-size region and a starter template
      tags: [screens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenCreate"
      responses:
        "201":
          $ref: "#/components/responses/Screen"
        "422":
          $ref: "#/components/responses/Problem"

  /screens/{id}:
    parameters:
      - $ref: "#/components/parameters/ScreenID"
    get:
      operationId: getScreen
      tags: [screens]
      responses:
        "200":
          $ref: "#/components/responses/Screen"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateScreen
      summary: Save a screen; it re-renders shortly after
      tags: [screens]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScreenUpdate"
      responses:
        "200":
          $ref: "#/components/responses/Screen"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          description: Invalid input or template syntax errors
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/TemplateProblem"
    delete:
      operationId: deleteScreen
      tags: [screens]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"

  /screens/{id}/preview:
    parameters:
      - $ref: "#/components/parameters/ScreenID"
    post:
      operationId: previewScreen
      summary: Render a screen, optionally with unsaved templates, without storing it
      tags: [screens]
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PreviewRequest"
      responses:
        "200":
          description: The browser render and the device image
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Preview"
        "404":
          $ref: "#/components/responses/Problem"
        "503":
          $ref: "#/components/responses/Problem"

  /screens/{id}/renders:
    parameters:
      - $ref: "#/components/parameters/ScreenID"
    get:
      operationId: listScreenRenders
      summary: Render history, newest first
      tags: [screens]
      responses:
        "200":
          description: Renders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Render"
        "404":
          $ref: "#/components/responses/Problem"
    post:
      operationId: renderScreen
      summary: Render and store now
      tags: [screens]
      responses:
        "200":
          description: The new render
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Render"
        "404":
          $ref: "#/components/responses/Problem"

  /playlists:
    get:
      operationId: listPlaylists
      tags: [playlists]
      responses:
        "200":
          description: All playlists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Playlist"
    post:
      operationId: createPlaylist
      tags: [playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistInput"
      responses:
        "201":
          $ref: "#/components/responses/Playlist"
        "422":
          $ref: "#/components/responses/Problem"

  /playlists/{id}:
    parameters:
      - $ref: "#/components/parameters/PlaylistID"
    get:
      operationId: getPlaylist
      tags: [playlists]
      responses:
        "200":
          $ref: "#/components/responses/Playlist"
        "404":
          $ref: "#/components/responses/Problem"
    put:
      operationId: updatePlaylist
      summary: Replace name and items (items keep their id when given)
      tags: [playlists]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlaylistInput"
      responses:
        "200":
          $ref: "#/components/responses/Playlist"
        "404":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deletePlaylist
      tags: [playlists]
      responses:
        "204":
          description: Deleted
        "404":
          $ref: "#/components/responses/Problem"

components:
  parameters:
    DeviceID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ScreenID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    PlaylistID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    ModelID:
      name: id
      in: path
      required: true
      schema: { type: integer, format: int64 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 500, default: 100 }

  responses:
    Device:
      description: The device
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Device"
    Screen:
      description: The screen
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Screen"
    Playlist:
      description: The playlist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Playlist"
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    Health:
      type: object
      required: [status, version, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        version:
          type: string
          example: 0.1.0
        database:
          type: string
          enum: [ok, error]

    SystemInfo:
      type: object
      required: [version, timezone, device_public_url, template_functions, framework_version]
      properties:
        version: { type: string }
        framework_version: { type: string, example: 3.4.4 }
        template_functions:
          type: array
          items: { type: string }
          description: Helper functions available in screen templates.
        timezone: { type: string, example: Europe/Vienna }
        device_public_url:
          type: string
          description: Base URL devices use to reach the device listener; empty if not configured.

    Event:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [device.created, device.updated, device.deleted, device.seen, device.logs,
                 screen.updated, screen.rendered, playlist.updated, model.updated]
        device_id: { type: integer, format: int64 }
        screen_id: { type: integer, format: int64 }
        playlist_id: { type: integer, format: int64 }
        model_id: { type: integer, format: int64 }

    DeviceModel:
      type: object
      required: [id, key, name, width, height, bit_depth, tone_curve]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string }
        name: { type: string }
        firmware_model: { type: string, nullable: true }
        width: { type: integer }
        height: { type: integer }
        bit_depth: { type: integer, enum: [1, 2, 4] }
        tone_curve:
          $ref: "#/components/schemas/ToneCurve"

    DeviceStatus:
      type: string
      enum: [pending, active, disabled]

    Device:
      type: object
      required: [id, mac, api_key, friendly_id, label, status, refresh_rate, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        mac: { type: string, example: "AA:BB:CC:DD:EE:FF" }
        api_key: { type: string }
        friendly_id: { type: string, example: K7Q2XM }
        label: { type: string }
        status:
          $ref: "#/components/schemas/DeviceStatus"
        model_id: { type: integer, format: int64, nullable: true }
        refresh_rate:
          type: integer
          description: Seconds between wakes.
        sleep_start: { type: string, nullable: true, example: "22:00" }
        sleep_end: { type: string, nullable: true, example: "06:00" }
        image_filename:
          type: string
          nullable: true
          description: Static image, shown when the device has no playlist; null = placeholder.
        playlist_id: { type: integer, format: int64, nullable: true }
        calibrating_until:
          type: string
          format: date-time
          nullable: true
          description: While in the future, the device shows the gray calibration pattern.
        firmware_version: { type: string, nullable: true }
        reported_model: { type: string, nullable: true }
        reported_width: { type: integer, nullable: true }
        reported_height: { type: integer, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        latest:
          $ref: "#/components/schemas/Telemetry"

    DeviceUpdate:
      type: object
      properties:
        label: { type: string, maxLength: 100 }
        model_id: { type: integer, format: int64 }
        refresh_rate: { type: integer, minimum: 30, maximum: 86400 }
        sleep_start:
          type: string
          description: HH:MM, empty string clears the sleep window.
        sleep_end:
          type: string
          description: HH:MM, empty string clears the sleep window.

    ImageFit:
      type: string
      enum: [contain, cover]
      default: contain

    ImageDither:
      type: string
      enum: [none, floyd-steinberg]
      default: floyd-steinberg

    Telemetry:
      type: object
      required: [id, at]
      properties:
        id: { type: integer, format: int64 }
        at: { type: string, format: date-time }
        battery_voltage: { type: number, nullable: true }
        battery_percent: { type: number, nullable: true }
        charging: { type: boolean, nullable: true }
        usb_connected: { type: boolean, nullable: true }
        rssi: { type: integer, nullable: true }
        wake_reason: { type: string, nullable: true }
        wake_time: { type: integer, nullable: true }
        firmware_version: { type: string, nullable: true }
        image_cached: { type: boolean, nullable: true }
        served_filename: { type: string, nullable: true }
        raw_headers:
          type: object
          nullable: true
          additionalProperties: { type: string }

    DeviceLog:
      type: object
      required: [id, message, received_at]
      properties:
        id: { type: integer, format: int64 }
        device_log_id: { type: integer, format: int64, nullable: true }
        level: { type: string, nullable: true }
        message: { type: string }
        source_path: { type: string, nullable: true }
        source_line: { type: integer, nullable: true }
        device_time: { type: string, format: date-time, nullable: true }
        received_at: { type: string, format: date-time }
        extra:
          type: object
          nullable: true
          additionalProperties: true

    DeviceLogPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DeviceLog"
        next_before_id:
          type: integer
          format: int64
          nullable: true
          description: Pass as before_id to load older entries; null when there are none.

    ToneCurve:
      type: object
      required: [gamma, black, white]
      properties:
        gamma: { type: number, minimum: 0.2, maximum: 5, example: 1.0 }
        black: { type: number, minimum: 0, maximum: 0.8, example: 0.0 }
        white: { type: number, minimum: 0.2, maximum: 1, example: 1.0 }

    Region:
      type: object
      required: [id, key, x, y, w, h, template]
      properties:
        id: { type: integer, format: int64 }
        key: { type: string, example: main }
        x: { type: integer }
        y: { type: integer }
        w: { type: integer }
        h: { type: integer }
        template: { type: string }

    Render:
      type: object
      required: [id, status, duration_ms, trigger, created_at]
      properties:
        id: { type: integer, format: int64 }
        status: { type: string, enum: [ok, error] }
        filename: { type: string, nullable: true }
        error: { type: string, nullable: true }
        duration_ms: { type: integer, format: int64 }
        trigger: { type: string, example: edit }
        created_at: { type: string, format: date-time }

    ScreenSummary:
      type: object
      required: [id, name, model_id, render_interval, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        model_id: { type: integer, format: int64 }
        render_interval: { type: integer }
        updated_at: { type: string, format: date-time }
        latest_render:
          $ref: "#/components/schemas/Render"
        latest_image:
          type: string
          nullable: true
          description: Filename of the newest successful render.

    Screen:
      allOf:
        - $ref: "#/components/schemas/ScreenSummary"
        - type: object
          required: [framework_version, head, regions]
          properties:
            framework_version: { type: string }
            head:
              type: string
              description: Extra HTML for the page head (styles).
            regions:
              type: array
              items:
                $ref: "#/components/schemas/Region"

    ScreenCreate:
      type: object
      required: [name, model_id]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        model_id: { type: integer, format: int64 }

    ScreenUpdate:
      type: object
      required: [name, model_id, head, render_interval, regions]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        model_id: { type: integer, format: int64 }
        head: { type: string, maxLength: 100000 }
        render_interval: { type: integer, minimum: 60, maximum: 86400 }
        regions:
          type: array
          items:
            type: object
            required: [id, template]
            properties:
              id: { type: integer, format: int64 }
              template: { type: string, maxLength: 200000 }

    PreviewRequest:
      type: object
      properties:
        templates:
          type: object
          description: Unsaved region templates by region key.
          additionalProperties: { type: string }
        head: { type: string }

    TemplateError:
      type: object
      required: [region, line, column, message]
      properties:
        region: { type: string }
        line: { type: integer }
        column: { type: integer }
        message: { type: string }

    Preview:
      type: object
      required: [raw, device, errors, duration_ms]
      properties:
        raw:
          type: string
          description: data:image/png;base64 URL of the browser screenshot.
        device:
          type: string
          description: data:image/png;base64 URL of the image as the device gets it.
        errors:
          type: array
          items:
            $ref: "#/components/schemas/TemplateError"
        duration_ms: { type: integer, format: int64 }

    TemplateProblem:
      allOf:
        - $ref: "#/components/schemas/Problem"
        - type: object
          properties:
            template_errors:
              type: array
              items:
                $ref: "#/components/schemas/TemplateError"

    PlaylistItem:
      type: object
      required: [screen_id, dwell, enabled]
      properties:
        id:
          type: integer
          format: int64
          description: Omit for new items.
        screen_id: { type: integer, format: int64 }
        dwell:
          type: integer
          minimum: 1
          maximum: 1000
          description: Number of device wakes the item stays on screen.
        refresh_rate:
          type: integer
          nullable: true
          minimum: 30
          maximum: 86400
          description: Seconds between wakes while this item shows; null = the device's own rate.
        enabled: { type: boolean }

    Playlist:
      type: object
      required: [id, name, items, device_count, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        items:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistItem"
        device_count: { type: integer }
        updated_at: { type: string, format: date-time }

    PlaylistInput:
      type: object
      required: [name, items]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        items:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/PlaylistItem"

    Problem:
      description: RFC 9457 problem details.
      type: object
      required: [title, status]
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: array
          items:
            $ref: "#/components/schemas/FieldError"

    FieldError:
      type: object
      required: [message]
      properties:
        field:
          type: string
        message:
          type: string
